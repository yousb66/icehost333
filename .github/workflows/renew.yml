name: IceHost Hourly KeepAlive

on:
  #schedule:
  #  - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-and-start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install seleniumbase requests

      - name: 🌐 设置sing-box代理 (SOCKS5 :1080 + HTTP :1081)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          echo "下载 setup_proxy.sh..."
          wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh > /tmp/setup_proxy.sh
          sed -i 's|curl -s "https://api.github.com/repos/SagerNet/sing-box/releases"|curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/SagerNet/sing-box/releases"|' /tmp/setup_proxy.sh
          echo "启动 sing-box..."
          bash /tmp/setup_proxy.sh &
          SINGBOX_PID=$!
          echo "等待代理就绪..."
          for i in {1..10}; do
            if curl -s --max-time 2 --socks5 127.0.0.1:1080 https://api.ipify.org > /dev/null 2>&1; then
              echo "代理就绪！"
              break
            fi
            sleep 2
          done
          curl -s --max-time 10 --socks5 127.0.0.1:1080 https://api.ipify.org > /dev/null && echo "代理出口: 已验证通过 (IP已隐藏)"

      - name: Run check script
        env:
          ICEHOST_SERVER_URL: ${{ secrets.ICEHOST_SERVER_URL }}
          ICEHOST_COOKIES: ${{ secrets.ICEHOST_COOKIES }}
          PROXY_URL: socks5://127.0.0.1:1080
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python icehost_run.py

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-debug-screenshot
          path: icehost_debug_screenshot.png
          if-no-files-found: ignore

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[].id')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              curl -s -X DELETE -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
            fi
          done
